repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: \.ipynb$
        # Vendored upstream notebooks keep their upstream bytes, outputs
        # included, so each file still hashes to upstream's blob id. Stripping
        # them would silently break that, which is the only thing that makes
        # the tree checkable against the commit its manifest.toml pins.
        exclude: ^screening subpackage/
        args: [--keep-id]
  - repo: local
    hooks:
      - id: make-format
        name: Run `make format`
        entry: make format
        language: system
        pass_filenames: false
