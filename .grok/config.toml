[mcp_servers.Humanitys-Last-Disease]
command = "python"
args = ["-u", "scripts/humanitys_last_disease_mcp.py"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 600

# One entry per tool the server declares. Generation gets a six-hour budget;
# local inspection and report operations get the short one.
[mcp_servers.Humanitys-Last-Disease.tool_timeouts]
run = 21600
screen_directory = 600
list_options = 120
read_verdict = 120
describe_architecture = 120
retrieve_databases = 120
retrieve_structures = 120
read_sequence_measures = 120
read_results = 120
list_output_files = 120
read_output_file = 120
backend_status = 120
declare_corpora = 120
plan_validation = 120
validate_output_files = 120
save_validation_report = 120
list_validation_reports = 120
plan_screening = 120
run_selected_screens = 3600
