# OpenFold3-backed refolding oracle configurations.
#
# The host and shared AF3 worker verify the OpenFold3 parameter family.
# Cached confidences must carry the weight family and verified checkpoint digest.

defaults:
  - af3
  - _self_

oracle:
  oracle_name: of3
  expected_weight_family: openfold3

oracle_ppi:
  oracle_name: of3_ppi
  expected_weight_family: openfold3

oracle_dna:
  oracle_name: of3_dna
  expected_weight_family: openfold3
