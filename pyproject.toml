[project]
name = "rfd4-proteina"
version = "0.0.3"
description = "Flow-matching foundation model for all-atom biomolecular design: proteins, nucleic acids, ligands and complexes"
readme = "README.md"
license-files = ["LICENSE"]
license = "BSD-3-Clause"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Institute for Protein Design" },
]
keywords = [
    "protein design",
    "generative model",
    "flow matching",
    "diffusion",
    "structural biology",
    "bioinformatics",
    "deep learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # AtomWorks pins the exact Biotite it supports, so Biotite is only given a floor here.
    "atomworks[ml,openbabel]>=3.0.4,<4",
    "biotite>=1.6.0",
    # Configuration & CLI (inherited from the root rc-foundry project)
    "rootutils>=1.0.7,<1.1",
    "hydra-core>=1.3.0,<1.4",
    "environs>=11.0.0,<12",
    # Model serialization and Hub downloads
    "huggingface-hub>=1.0,<2",
    "safetensors>=0.4,<1",
    # Logging
    "wandb>=0.15.10,<1",
    "rich>=13.9.4",
    "loguru",
    # Typing
    "jaxtyping>=0.2.17,<1",
    "beartype>=0.18.0,<1",
    # ML core
    "torch>=2.11,<3",
    "lightning>=2.6.0",
    "peft>=0.21.2,<0.22",
    "einops>=0.8.0,<1",
    "opt_einsum>=3.4.0,<4",
    # Data / numerics
    "numpy>=1.25.0",
    "scipy>=1.13.1",
    "pandas>=2,<3",
    "filelock>=3.12",  # Coordinate metric writers and aggregation across processes.
    "pyyaml>=6.0",  # Packaged RFD4 residue vocabulary
    "toolz",
    "fire",
    "networkx",
    # Antibody numbering, used by the default metric set
    "anarcii>=2.0.8,<3",
    "assertpy",
]

[project.optional-dependencies]
httk = ["rdkit==2025.9.6"]
cellprofiler = ["pillow>=11,<14"]
pksim = ["rdkit==2025.9.6"]
cypstrate = ["rdkit==2025.9.6"]
toxscan = ["rdkit==2025.9.6", "lmdb==1.7.5", "scikit-learn>=1.5,<2", "threadpoolctl>=3,<4"]
dimorphite = ["dimorphite-dl==2.1.0", "rdkit==2025.9.6"]
p2rank = ["gemmi>=0.6.5,<1"]
propka = ["propka==3.5.1", "gemmi>=0.6.5,<1"]
crest = ["rdkit==2025.9.6"]
metfrag = ["rdkit==2025.9.6"]
fastsolv = ["rdkit==2025.9.6", "mordredcommunity==2.0.7", "numpy==2.2.6"]
scscore = ["rdkit==2025.9.6"]
spyrmsd = ["spyrmsd==0.9.0", "rdkit==2025.9.6"]
sygma = ["rdkit==2025.9.6"]
tnp = ["gemmi>=0.6.5,<1"]
vina = ["gemmi>=0.6.5,<1"]
prodigy = [
    "prodigy-prot==2.5.1",
    "freesasa==2.2.1",
    "biopython==1.88",
]
docs = [
    "linkify-it-py>=2.0.0,<3",
    "myst-parser>=4.0.0,<5",
    "nbsphinx>=0.9.0,<1",
    "pypandoc-binary>=1.15,<2",
    "pydata-sphinx-theme>=0.16.0,<1",
    "sphinx>=8.0.0,<9",
    "sphinx-autodoc-typehints>=2.0.0,<4",
    "sphinx-reredirects>=1.0,<2",
    "sphinx-togglebutton>=0.3,<1",
]
# The predicted route in rfproteina.disease.ligand_safety: ADMET-AI's classification endpoints, which answer seven of
# the ten ligand-safety panel axes (Nav1.5, BCRP and BSEP have no endpoint). Optional because it pulls Chemprop; the
# measured route, ChEMBL activities in nM, needs nothing beyond the base install. ADMET-AI ships its two Chemprop
# ensembles inside the wheel (~13 MB), so there is no separate weight download. It also pulls RDKit, which
# rfproteina.disease.ligand_alerts needs and no other dependency declares.
ligand-safety = [
    "admet-ai>=2.0.1,<3",
]
# DeepSP, the sequence-only surrogate for spatial aggregation propensity, run by
# rfproteina.disease.deepsp. Only h5py: DeepSP ships Keras models, and rather than
# add TensorFlow beside torch for three small Conv1D stacks the forward pass is
# reimplemented in torch, so the one thing missing is a reader for the .h5 weights.
# The port is checked against DeepSP's own published descriptors in
# tests/test_disease_deepsp.py. The models themselves are a 17 MB download from the
# DeepSP repository, not a package, and ANARCII (a base dependency) replaces the
# ANARCI its own script shells out to.
deepsp = [
    "h5py>=3.11,<4",
]
# DeepViscosity, the ensemble that turns DeepSP's 30 descriptors into a
# high-concentration viscosity class, run by rfproteina.disease.deepviscosity.
# Same lab, same Keras 2.11, same choice: the dense stack is evaluated in torch
# rather than adding TensorFlow, and the port reproduces the probabilities
# upstream published for its own 16-antibody test set to 4.6e-07.
#
# h5py reads the 102 weight files. joblib is needed **only by the installer**:
# upstream ships its input scaler as an sklearn pickle, and unpickling a
# downloaded file runs whatever that file says, so scripts/install_deepviscosity.py
# verifies a pinned SHA-256, reads it through an allowlisted unpickler that can
# reach no callable of an attacker's choosing, and writes plain JSON. Predicting
# needs neither joblib nor scikit-learn, and the library opens no pickle.
#
# DeepSP's own models are also required: they generate the descriptors, and they
# are not duplicated here. Install the deepsp extra and run its installer too.
deepviscosity = [
    "h5py>=3.11,<4",
    "joblib>=1.3,<2",
]
# DockQ is deliberately NOT an extra here, and must not become one.
#
# rfproteina.disease.interactions calls it for the full complex-quality score,
# but every released DockQ (2.1.3 and up; 2.1.2 is yanked) requires numpy<2.0
# while this project runs numpy 2.x. Adding it to an extra makes the resolver
# satisfy that by DOWNGRADING numpy underneath torch, bionemo-ir and TMol. A
# constrained dry run refuses it outright:
#
#   Because dockq>=2.1.3 depends on numpy<2.0 and numpy==2.2.6, we can
#   conclude that dockq>=2.1.3 cannot be used.
#
# So it is installed into its own virtual environment instead, by
# scripts/install_dockq.py, and found through DOCKQ_EXECUTABLE or
# DATA_PATH/dockq -- the same isolation mhc_tables uses for mhcflurry. Running
# it through its CLI also gets the automatic chain mapping v2 added, which the
# in-process API does not do. Without it, Fnat is still computed natively.
#
# Revisit only once DockQ's numpy pin moves; until then, leaving this comment
# here is the whole point.
# ProLIF, the typed interaction-fingerprint engine rfproteina.disease.interactions
# prefers over its own native fallback. The two are not the same measurement and
# the method id says which produced a count: ProLIF protonates and types atoms,
# so on one stacked pose it reports a single typed hydrophobic interaction where
# the native heavy-atom proxy reports dozens of atom pairs. Nothing is gated on
# either, so installing this changes reported numbers and no verdict.
#
# **Capped below 2.2 on purpose.** Every prolif 2.2.x requires gemmi>=0.7.5, and
# bionemo-ir in all-cuda13 pins gemmi==0.6.5, so taking 2.2 would silently break
# the inverse-folding runtime to gain an interaction fingerprint. 2.1.x declares
# no gemmi dependency at all. Raise this cap only once bionemo-ir's pin moves.
#
# Note for callers: prolif_fingerprint opens the ligand with mda.Universe, and
# MDAnalysis ships no SDF reader, so the ligand must be PDB, MOL2 or PDBQT even
# though ProLIF itself can read SDF through its own supplier.
prolif = [
    "prolif>=2.1,<2.2",
]
# The MM-GBSA tier in rfproteina.disease.rescoring: a single-structure binding
# free energy from OpenMM (MIT for the API, Reference and CPU platforms) under an
# implicit Generalized Born solvent, with PDBFixer adding the hydrogens and
# repairing the residues a generated complex arrives without. Both are imported
# inside the functions that use them, so every other screen runs without this
# extra and rescore_complex raises OpenMMUnavailableError until it is installed.
# They were undeclared before: the tier was written and tested, and nothing in
# the project said what to install to run it.
#
# This is not the FEP tier below it. OpenFE, pmx and alchemlyb stay out on
# purpose -- plan_rbfe names them, scaffolds the calculation and refuses to
# fabricate a free energy, because an explicit-solvent MD campaign is not
# something this install budgets for.
rescoring = [
    "openmm>=8.6,<9",
    "pdbfixer>=1.12,<2",
]
# The nanomolar regressors in rfproteina.disease.ligand_regressor, for the
# three panel axes ADMET-AI has no endpoint for: Nav1.5, BCRP and BSEP. The
# default backend is a Morgan-fingerprint forest, which measured better than a
# D-MPNN on all three axes at this data size (350 to 1,700 training molecules),
# so scikit-learn rather than torch is what the default route needs.
#
# **Chemprop is still required to train**, even for the forest: the
# scaffold-balanced splitter comes from chemprop.data, and a random split over
# these congeneric series would flatter a fingerprint model badly. It arrives
# with the ligand-safety extra (ADMET-AI vendors it), so install both to train;
# prediction from a saved forest needs only this one.
ligand-regressor = [
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",
]
# Everything beyond the base package, for one CUDA major. Install the one matching your driver even if you never compute
# a metric: it carries the fused cuEquivariance kernels the model itself loads (see rfproteina/__init__.py) as well as
# the TMol CUDA operators. It also adds the training and analysis tools (matplotlib, scikit-learn, boto3 for the S3
# blob store) and, for CUDA 13 only, the BioIR runtime. The two extras are mutually exclusive.
all-cuda13 = [
    "tmol[cu13]>=0.2.0,<0.3; sys_platform == 'linux'",
    "posebusters",
    "matplotlib",
    "scikit-learn",
    "boto3>=1.34,<2",
    # PyTorch's CuTe RMSNorm kernels require both CUTLASS DSL and TVM FFI.
    "apache-tvm-ffi>=0.1.14,<0.2; sys_platform == 'linux'",
    "cuda-core>=1.0.1,<2; sys_platform == 'linux'",
    "cuda-python>=13.3.1,<14; sys_platform == 'linux'",
    "nvidia-cutlass-dsl>=4.5.2,<4.6; sys_platform == 'linux'",
    "nvidia-cutlass-dsl-libs-base>=4.5.2,<4.6; sys_platform == 'linux'",
    "cuequivariance>=0.13.0,<0.14; sys_platform == 'linux'",
    "cuequivariance-torch>=0.13.0,<0.14; sys_platform == 'linux'",
    "cuequivariance-ops-cu13>=0.13.0,<0.14; sys_platform == 'linux'",
    "cuequivariance-ops-torch-cu13>=0.13.0,<0.14; sys_platform == 'linux'",
    "bionemo-ir>=0.2.0,<0.3; sys_platform == 'linux'",
]
all-cuda12 = [
    "tmol[cu12]>=0.2.0,<0.3; sys_platform == 'linux'",
    "posebusters",
    "matplotlib",
    "scikit-learn",
    "boto3>=1.34,<2",
    "cuequivariance>=0.13.0,<0.14; sys_platform == 'linux'",
    "cuequivariance-torch>=0.13.0,<0.14; sys_platform == 'linux'",
    "cuequivariance-ops-cu12>=0.13.0,<0.14; sys_platform == 'linux'",
    "cuequivariance-ops-torch-cu12>=0.13.0,<0.14; sys_platform == 'linux'",
]

# Contributor tooling (not a published extra): pip install -e . --group dev   |   uv pip install -e . --group dev
[dependency-groups]
dev = [
    # Linters & formatters
    "ruff==0.8.3",
    # Debugger/interactive
    "debugpy>=1.8.5,<2",
    "ipykernel>=6.31.0,<7",
    # Testing tools. Every installed pytest plugin is imported on every pytest
    # invocation (autoload costs 5.1s here, measured), so an unused one is a tax
    # on each targeted run. pytest-testmon (1.4s) and pytest-benchmark (0.3s)
    # were dropped as unreferenced: no `--testmon`, no benchmarked test, no use
    # of the `benchmark` fixture anywhere in the tree. The `benchmark` marker
    # stays registered and the CPU lane keeps filtering it, so re-adding the
    # plugin is a one-line change.
    "pytest>=8.2.0,<9",
    "pytest-xdist>=3.6.1,<4",
    "pytest-dotenv>=0.5.2,<1",
    "pytest-cov>=4.1.0,<5",
    "coverage[toml]>=7.10.2,<8",
]

[project.urls]
Homepage = "https://rfd4-proteina.org/"
Documentation = "https://rfd4-proteina.org/latest/"
Repository = "https://github.com/RosettaCommons/RFD4-Proteina"
Issues = "https://github.com/RosettaCommons/RFD4-Proteina/issues"

[project.scripts]
rfd4-generate = "script_utils.entrypoints:generate"
rfd4-evaluate = "rfproteina.evaluate:main_hydra"
rfd4-train = "rfproteina.train:main"
rfd4-train-ae = "rfproteina.partial_autoencoder.train:main"
rfd4-af3server = "rfproteina.af3server.cli:main"
human = "rfproteina.disease.cli:main"

[tool.uv]
conflicts = [
    [
        { extra = "all-cuda12" },
        { extra = "all-cuda13" },
    ],
]

# Pytest
[tool.pytest.ini_options]
# The Apptainer smoke script and the website checks are not part of this suite.
testpaths = ["tests"]
# Register the markers used across the suite so `-m` filters (and any future
# `--strict-markers`) stay warning-free.
markers = [
    "gpu: end-to-end tests that require a GPU",
    "regression: GPU regression tests gated on a SOTA checkpoint",
    "cluster: cluster launcher / srun syntax checks",
    "slow: slower tests",
    "very_slow: tests too slow for the default CPU lane",
    "benchmark: pytest-benchmark performance tests",
    "digs: host-specific sanity checks, maintainer clusters only",
    "fast: fast-running tests",
    "no_checkpoint_cache: opt out of the shared checkpoint-load fixture (needs fresh model state per run)",
]

# Build system
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml", "README.md", "LICENSE", ".project-root",
    "src", "configs", "data/cath_label_mapping.pkl",
    "data/benchmarks/monomer",
    "scripts/check_distribution.py",
    "docs/contributing/packaging.md",
]
exclude = [
    "configs/metrics/custom_metrics/**",
    "src/rfproteina/metrics/custom_metrics/**",
    "src/rfproteina/metrics/cdr_torsion_data/**",
    "**/__pycache__/**",
]

[tool.hatch.build.targets.wheel]
exclude = [
    "configs/metrics/custom_metrics/**",
    "src/rfproteina/metrics/custom_metrics/**",
    "src/rfproteina/metrics/cdr_torsion_data/**",
    "**/__pycache__/**",
]
only-include = [
    "src/rfproteina",
    "src/rfd4_proteina",
    "src/script_utils",
    "configs",
    "data/benchmarks/monomer",
    "data/cath_label_mapping.pkl",
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"configs" = "rfproteina/configs"
"data" = "rfproteina/data"

[tool.hatch.build.targets.wheel.force-include]
".project-root" = "rfproteina/.project-root"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
exclude = [
    "docs/examples/*.py",  # Jupytext notebook sources
    "*.ipynb",  # notebooks are not linted or formatted
    # Vendored upstream source, kept byte-identical to the commit each tool's
    # manifest.toml pins -- that is what makes the tree checkable against
    # upstream. `make format` runs `ruff format` and `ruff check --fix` over the
    # whole checkout, so without this it would rewrite these files to this
    # project's style and silently break that property.
    "screening subpackage/**",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "env",
    ".venv",
    "venv",
    "data",
    "dev.py",
    "ProteinMPNN/*"
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable a comprehensive set of rules for better code quality
extend-select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    #"D",   # pydocstyle
    "UP",  # pyupgrade -- use the latest supported python syntax
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "NPY", # fix deprecated numpy functions / types
    "RUF", # Ruff-specific rules
    "T10", # catch accidental debugger breakpoints in code
    "ANN"
]

# Ignore specific rules that might conflict with our style or are too strict
ignore = [
    "B006",  # do not use mutable data structures for argument defaults
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D100",  # Missing docstring in public module
    "NPY002",  # replacing legacy np.random.rand wih np.random.Generator
    "SIM108",  # Replace if-else blocks
    "ANN002",  # missing annotation for `*args`
    "ANN003",  # missing annotation for `**kwargs`
    "ANN204",  # missing return type annotation for special method `__init__`
    "ANN401",  # disallow `Any` type
    "F722",  # for jaxtyping shape annotation
    # F821 (undefined name) is NOT ignored globally. It was, "temporarily", for
    # jaxtyping's shape strings -- but that switched the check off for the whole
    # tree, so any typo'd name in src/ passed lint and surfaced only when the
    # line ran. It is now exempted per file below, for the files whose
    # annotations ruff cannot resolve.
    "E741",  # enable us to use variables like "L"
    "N806",  # enable us to use capital letters in variable names, also like "L"
    "N812",  # allow standard conventions like `import lightning as L` and `import torch.nn.functional as F`
    "N801",  # enable us to use non-CapWords class names
    "N802",  # enable us to use capital letters in function names
    "N803",  # enable us to use capital letters in argument names
]

[tool.ruff.lint.isort]
known-first-party = ["rfproteina"]
known-third-party = ["wandb"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]              # re-exports and import-for-side-effect
"tests/*" = ["D", "E", "RUF", "ANN"]  # annotating test signatures buys nothing
"docs/**/*.ipynb" = ["D", "E", "RUF", "ANN"]  # tutorial helpers: annotations/style buy nothing (B stays on)

# F821 where ruff cannot resolve the annotation, so the check stays on
# everywhere else. Two causes, both false positives:
#   jaxtyping shape strings -- Float[Tensor, "b n 3"] names b, n as if they were
#   values; and beartype.typing.Literal, which ruff does not recognise as
#   typing.Literal, so Literal["mean"] reads as a forward reference.
# A file leaving this list as its annotations change is the point. Nothing here
# is a dangling name: a real one was found in rasa_metrics.py when the global
# ignore came off, and was fixed rather than listed.
"src/rfproteina/conditions.py" = ["F821"]
"src/rfproteina/flow_matching/product_space_flow_matcher.py" = ["F821"]
"src/rfproteina/flow_matching/signed_volume_loss.py" = ["F821"]
"src/rfproteina/metrics/gt_structure_comparison.py" = ["F821"]
"src/rfproteina/metrics/physics/contact_ms/*.py" = ["F821"]
"src/rfproteina/nn/feature_factory.py" = ["F821"]
"src/rfproteina/partial_autoencoder/autoencoder.py" = ["F821"]
"src/rfproteina/proteina.py" = ["F821"]
"src/rfproteina/utils/atom_permutation.py" = ["F821"]

[tool.pyright]
typeCheckingMode = "off"
